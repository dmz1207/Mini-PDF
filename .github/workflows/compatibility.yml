name: PDF compatibility
on:
  push:
    branches: [main]
    paths:
      - '源码/**/*.cs'
      - '源码/**/*.ps1'
      - '源码/corpus_*.py'
      - '源码/compare_corpus.py'
      - '源码/corpus_sources.json'
      - '源码/compatibility-results.csv'
      - '.github/workflows/compatibility.yml'
  pull_request:
    paths:
      - '源码/**/*.cs'
      - '源码/**/*.ps1'
      - '源码/corpus_*.py'
      - '源码/compare_corpus.py'
      - '源码/corpus_sources.json'
      - '源码/compatibility-results.csv'
      - '.github/workflows/compatibility.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-pdfs:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_CACHE_DIR: ${{ github.workspace }}/work/pip-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install development renderer
        run: python -m pip install pymupdf==1.28.0
      - name: Build and probe pinned public PDFs
        shell: pwsh
        run: |
          & '.\源码\test-corpus.ps1' -Python python -Name ci -Workers 4
      - name: Detect regressions against reviewed results
        run: python ".\源码\compare_corpus.py" ".\源码\compatibility-results.csv" ".\work\compatibility\runs\ci\results.jsonl"
      - name: Summarize diagnostics
        if: always()
        shell: pwsh
        run: |
          $summaryPath = '.\work\compatibility\reports\compatibility-summary.json'
          if (Test-Path -LiteralPath $summaryPath) {
            $result = Get-Content -LiteralPath $summaryPath -Raw | ConvertFrom-Json
            "Tested $($result.logical_pdfs) PDF paths ($($result.unique_pdfs) unique contents)." >> $env:GITHUB_STEP_SUMMARY
            "This is preservation/regression coverage, with reviewed malformed, password and engine limitations in the baseline." >> $env:GITHUB_STEP_SUMMARY
          }
